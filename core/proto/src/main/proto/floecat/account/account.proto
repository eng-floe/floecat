syntax = "proto3";

package ai.floedb.floecat.account;

option java_multiple_files = true;
option java_package = "ai.floedb.floecat.account.rpc";
option java_outer_classname = "AccountProto";

import "floecat/common/common.proto";

import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

message Account {
  ai.floedb.floecat.common.ResourceId resource_id = 1;
  string display_name = 2;
  optional string description = 3;
  google.protobuf.Timestamp created_at = 10;
  // Free-form key/value tags used to scope which floecat instance manages the
  // account (e.g. a CI run stamps `ci-run=<run-id>`; see the planner tag filter).
  map<string, string> tags = 99;
}

message AccountSpec {
  optional string display_name = 1;
  optional string description = 2;
  map<string, string> tags = 99;
}

// ====== Requests / Responses ======

message ListAccountsRequest {
  ai.floedb.floecat.common.PageRequest page = 1;
}

message ListAccountsResponse {
  repeated Account accounts = 1;
  ai.floedb.floecat.common.PageResponse page = 2;
}

message CreateAccountRequest {
  AccountSpec spec = 1;
  // Optional resource id for external account synchronization.
  optional ai.floedb.floecat.common.ResourceId account_id = 2;
  ai.floedb.floecat.common.IdempotencyKey idempotency = 98;
}

message CreateAccountResponse {
  Account account = 1;
  ai.floedb.floecat.common.MutationMeta meta = 2;
}

message GetAccountRequest {
  ai.floedb.floecat.common.ResourceId account_id = 1;
}

message GetAccountResponse {
  Account account = 1;
}

message UpdateAccountRequest {
  ai.floedb.floecat.common.ResourceId account_id = 1;
  AccountSpec spec = 2;
  google.protobuf.FieldMask update_mask = 3;
  ai.floedb.floecat.common.Precondition precondition = 98;

}

message UpdateAccountResponse {
  Account account = 1;
  ai.floedb.floecat.common.MutationMeta meta = 2;
}

message DeleteAccountRequest {
  ai.floedb.floecat.common.ResourceId account_id = 1;
  ai.floedb.floecat.common.Precondition precondition = 98;
}

message DeleteAccountResponse {
  ai.floedb.floecat.common.MutationMeta meta = 1;
}

// ====== Internal account assignment control ======
//
// Core pushes each managed Floecat process its complete assignment. Floecat never calls Core or
// another Floecat; both RPCs below are answered by Floecat when Core calls them.

// Per-pod assignment mode. In DRAINING a process stops admitting accounts that leave its set and
// does not yet admit accounts that join it. In SERVING it admits its full set.
enum AssignmentMode {
  AM_UNSPECIFIED = 0;
  AM_DRAINING = 1;
  AM_SERVING = 2;
}

// Per-account status on one process.
enum AccountServingMode {
  ASM_UNSPECIFIED = 0;
  ASM_UNASSIGNED = 1;
  ASM_SERVING = 2;
  ASM_DRAINING = 3;
}

message ApplyAssignmentRequest {
  // Core-owned monotonic epoch. A lower epoch is rejected; an equal epoch is accepted only when
  // it repeats the current state or moves DRAINING -> SERVING.
  int64 epoch = 1;
  AssignmentMode mode = 2;
  // Complete set of accounts this process owns under the epoch. Never a delta.
  repeated string account_ids = 3;
  // Subset of account_ids for which garbage collection may run.
  repeated string gc_allowed_account_ids = 4;
  // Exact process incarnation returned by GetAssignmentStatus. A pod name is insufficient because
  // a replacement process must not inherit the previous process's assignment blindly.
  string target_incarnation = 5;
}

message GetAssignmentStatusRequest {}

message AccountOwnershipStatus {
  string account_id = 1;
  AccountServingMode mode = 2;
  bool gc_allowed = 3;
  int64 active_resolutions = 4;
  int64 active_mutations = 5;
  int64 active_gc = 6;
  // Active mutations and resolutions are both zero.
  bool drained = 7;
  string pointer_index_state = 8;
}

message AssignmentStatus {
  string member_id = 1;
  string incarnation = 2;
  int64 epoch = 3;
  AssignmentMode mode = 4;
  // True when the current assignment was restored from the member index at startup rather than
  // received from Core.
  bool recovered_from_store = 5;
  repeated AccountOwnershipStatus accounts = 6;
}

message ApplyAssignmentResponse {
  AssignmentStatus status = 1;
}

message GetAssignmentStatusResponse {
  AssignmentStatus status = 1;
}

// ====== Service ======

service AccountService {
  rpc ListAccounts (ListAccountsRequest) returns (ListAccountsResponse);
  rpc GetAccount (GetAccountRequest) returns (GetAccountResponse);
  rpc CreateAccount (CreateAccountRequest) returns (CreateAccountResponse);
  rpc UpdateAccount (UpdateAccountRequest) returns (UpdateAccountResponse);
  rpc DeleteAccount (DeleteAccountRequest) returns (DeleteAccountResponse);
}

// Core-to-Floecat control only. Floecat never calls Core or another Floecat.
service AccountAssignmentControl {
  rpc ApplyAssignment(ApplyAssignmentRequest) returns (ApplyAssignmentResponse);
  rpc GetAssignmentStatus(GetAssignmentStatusRequest) returns (GetAssignmentStatusResponse);
}
