syntax = "proto3";

package ai.floedb.floecat.account;

option java_multiple_files = true;
option java_package = "ai.floedb.floecat.account.rpc";
option java_outer_classname = "AccountProto";

import "floecat/common/common.proto";

import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

message Account {
  ai.floedb.floecat.common.ResourceId resource_id = 1;
  string display_name = 2;
  optional string description = 3;
  google.protobuf.Timestamp created_at = 10;
  // Free-form key/value tags used to scope which floecat instance manages the
  // account (e.g. a CI run stamps `ci-run=<run-id>`; see the planner tag filter).
  map<string, string> tags = 99;
}

message AccountSpec {
  optional string display_name = 1;
  optional string description = 2;
  map<string, string> tags = 99;
}

// ====== Requests / Responses ======

message ListAccountsRequest {
  ai.floedb.floecat.common.PageRequest page = 1;
}

message ListAccountsResponse {
  repeated Account accounts = 1;
  ai.floedb.floecat.common.PageResponse page = 2;
}

message CreateAccountRequest {
  AccountSpec spec = 1;
  // Optional resource id for external account synchronization.
  optional ai.floedb.floecat.common.ResourceId account_id = 2;
  ai.floedb.floecat.common.IdempotencyKey idempotency = 98;
}

message CreateAccountResponse {
  Account account = 1;
  ai.floedb.floecat.common.MutationMeta meta = 2;
}

message GetAccountRequest {
  ai.floedb.floecat.common.ResourceId account_id = 1;
}

message GetAccountResponse {
  Account account = 1;
}

message UpdateAccountRequest {
  ai.floedb.floecat.common.ResourceId account_id = 1;
  AccountSpec spec = 2;
  google.protobuf.FieldMask update_mask = 3;
  ai.floedb.floecat.common.Precondition precondition = 98;

}

message UpdateAccountResponse {
  Account account = 1;
  ai.floedb.floecat.common.MutationMeta meta = 2;
}

message DeleteAccountRequest {
  ai.floedb.floecat.common.ResourceId account_id = 1;
  ai.floedb.floecat.common.Precondition precondition = 98;
}

message DeleteAccountResponse {
  ai.floedb.floecat.common.MutationMeta meta = 1;
}

// ====== Internal account ownership control ======

// Process-local serving state installed by Core. The assignment is fenced by the process
// incarnation and version; destructive GC additionally requires a short-lived lease.
enum AccountServingMode {
  ASM_UNSPECIFIED = 0;
  ASM_UNASSIGNED = 1;
  ASM_SERVING = 2;
  ASM_DRAINING = 3;
}

message ApplyAccountModeRequest {
  string account_id = 1;
  int64 assignment_version = 2;
  // Exact process incarnation returned by GetAccountStatus. A pod ordinal is insufficient because
  // a replacement process must not inherit the previous process's authority.
  string target_process_incarnation = 3;
  AccountServingMode mode = 4;
  bool gc_allowed = 5;
  // Positive only when gc_allowed is true. Equal-version commands renew this lease.
  int64 gc_lease_ttl_ms = 6;
}

message GetAccountStatusRequest {
  string account_id = 1;
}

message AccountOwnershipStatus {
  string account_id = 1;
  int64 assignment_version = 2;
  string process_incarnation = 3;
  AccountServingMode mode = 4;
  bool gc_allowed = 5;
  int64 active_resolutions = 6;
  int64 active_mutations = 7;
  int64 active_gc = 8;
  int64 referenced_roots = 9;
  string pointer_cache_state = 10;
  bool drained = 11;
  int64 gc_lease_remaining_ms = 12;
}

message ApplyAccountModeResponse {
  AccountOwnershipStatus status = 1;
}

message GetAccountStatusResponse {
  AccountOwnershipStatus status = 1;
}

// ====== Service ======

service AccountService {
  rpc ListAccounts (ListAccountsRequest) returns (ListAccountsResponse);
  rpc GetAccount (GetAccountRequest) returns (GetAccountResponse);
  rpc CreateAccount (CreateAccountRequest) returns (CreateAccountResponse);
  rpc UpdateAccount (UpdateAccountRequest) returns (UpdateAccountResponse);
  rpc DeleteAccount (DeleteAccountRequest) returns (DeleteAccountResponse);
}

// Core-to-Floecat control only. Floecat never calls Core or another Floecat.
service AccountOwnershipControl {
  rpc ApplyAccountMode(ApplyAccountModeRequest) returns (ApplyAccountModeResponse);
  rpc GetAccountStatus(GetAccountStatusRequest) returns (GetAccountStatusResponse);
}
