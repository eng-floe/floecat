syntax = "proto3";

package ai.floedb.floecat.catalog;

option java_multiple_files = true;
option java_package = "ai.floedb.floecat.catalog.rpc";

import "floecat/common/common.proto";

// Opaque engine-owned bytes. Floecat retains the metadata but never decodes the payload.
message EngineHintPayload {
  bytes payload = 1;
  map<string, string> metadata = 2;
}

// Every column hint for one engine, keyed by the engine-defined payload type.
message ColumnEngineHints {
  map<string, EngineHintPayload> hints = 1;
}

// The complete persisted hint set for one relation and one exact engine version.
message RelationHintsResource {
  ai.floedb.floecat.common.ResourceId relation_id = 1;
  string engine_kind = 2;
  string engine_version = 3;
  string relation_identity = 4;
  map<string, EngineHintPayload> relation_hints = 5;
  map<int64, ColumnEngineHints> column_hints = 6;
}
