syntax = "proto3";
package ai.floedb.floecat.catalog;

option java_multiple_files = true;
option java_package = "ai.floedb.floecat.catalog.rpc";

import "floecat/common/common.proto";
import "floecat/catalog/snapshot.proto";

message OwnerPublicationManifestRef {
  string account_id = 1;
  string table_id = 2;
  int64 snapshot_id = 3;
  string manifest_uri = 4;
  uint64 manifest_bytes = 5;
  bytes manifest_sha256 = 6;
  uint64 stats_record_count = 7;
  uint64 index_artifact_count = 8;
}

// Small immutable GC root for one in-flight Owner publication. The namespaces protect objects
// uploaded after Begin; exact capture manifests protect the source reuse state and, after Complete
// seals the publication, the successor coverage manifest until activation.
message OwnerPublicationLease {
  uint32 format_version = 1;
  string account_id = 2;
  string table_id = 3;
  string publication_id = 4;
  string reusable_namespace_prefix = 5;
  repeated string protected_capture_manifest_uris = 6;
  // Begin and each Complete attempt renew this deadline. GC ignores an expired lease, so an
  // abandoned publication cannot pin the table's reusable namespace indefinitely.
  uint64 expires_at_epoch_ms = 7;
  // Snapshot-scoped upload namespace returned by Begin. It protects the capture manifest,
  // registration payload, and commitment indexes before their exact names are known to Floecat.
  repeated string protected_capture_manifest_prefixes = 8;
}

message BeginOwnerPublicationRequest {
  ai.floedb.floecat.common.ResourceId table_id = 1;
  int64 snapshot_id = 2;
  string owner_id = 3;
  reserved 4;
  string owner_generation_id = 5;
  bool publish_file_stats = 6;
  bool publish_indexes = 7;
  // Previous finalized snapshot selected as this generation's reuse basis. From Begin until
  // activation, Floecat leases both the table's reusable-object namespace and the exact source or
  // successor capture manifest so concurrent GC cannot retire inputs or in-flight uploads.
  optional int64 reuse_source_snapshot_id = 8;
}

message BeginOwnerPublicationResponse {
  // Stable capability derived from the complete Owner assignment identity. Complete rejects a
  // capability for which Begin did not durably reserve a generation.
  string publication_id = 1;
  string generation_id = 2;
  // Executors derive a stable per-work subdirectory below this prefix and write mandatory
  // planner-statistics partials plus optional file stats and index-wrapper artifacts there.
  // Managed sidecar payloads use an index-sidecars/ child; an index wrapper may instead reference
  // an externally configured sidecar URI.
  string executor_object_prefix = 3;
  // Owner writes each table/column aggregate as a separate object below this prefix.
  string owner_object_prefix = 4;
  // Owner writes the reference-only publication manifest below this prefix.
  string manifest_object_prefix = 5;
  // Physical Floecat blob-store root and non-secret client settings. Object prefixes above are
  // blob-store keys relative to this URI. Authentication is supplied by the service workload.
  string artifact_storage_uri_root = 6;
  map<string, string> artifact_storage_properties = 7;
  // Table-scoped prefix for immutable reusable statistics and managed sidecars.
  string reusable_object_prefix = 8;
  // True only when the publication lease also protects the requested Owner-v2 reuse source.
  bool reuse_source_leased = 9;
  // Retry Begin or call Complete before this time to renew GC protection while uploading.
  uint64 reuse_lease_expires_at_epoch_ms = 10;
  // Bounded external-manifest limits selected by Floecat for this publication. The Owner must
  // construct both registration and reusable-coverage chunks no larger than the byte limit;
  // registration chunks must also respect the object and target limits.
  uint64 external_manifest_chunk_max_bytes = 11;
  uint64 registration_chunk_max_objects = 12;
  uint64 registration_chunk_max_targets = 13;
}

message CompleteOwnerPublicationRequest {
  ai.floedb.floecat.common.ResourceId table_id = 1;
  int64 snapshot_id = 2;
  string publication_id = 3;
  // The only data-plane descriptor carried over gRPC. Floecat reads this small metadata object,
  // registers its existing artifacts, and atomically activates the stats/index generations.
  OwnerPublicationManifestRef manifest = 4;
  // Snapshot metadata published in the same fenced pointer transaction as the statistics and
  // index generations. The snapshot may not be visible before this call commits.
  SnapshotSpec snapshot = 5;
  // Repeated from Begin so Floecat can bind Complete to the authenticated caller and re-derive
  // the deterministic publication capability without retaining mutable reservation state.
  string owner_id = 6;
  string owner_generation_id = 7;
  // Opaque phase/chunk cursor returned by the preceding bounded call. Empty starts completion.
  // Repeating the immediately preceding cursor is safe after a lost response.
  string completion_cursor = 8;
}

message CompleteOwnerPublicationResponse {
  uint64 aggregate_stats_published = 1;
  uint64 file_stats_published = 2;
  uint64 index_artifacts_published = 3;
  bool activated = 4;
  // Opaque cursor to send on the next Complete call. When activated is false, Floecat has durably
  // verified one bounded manifest chunk and deliberately returned before consuming the deadline.
  string next_completion_cursor = 5;
  // Renewed GC-protection deadline for this Complete attempt. Zero is returned only after an
  // activated publication has released its lease.
  uint64 reuse_lease_expires_at_epoch_ms = 6;
}

service OwnerPublicationService {
  rpc BeginOwnerPublication(BeginOwnerPublicationRequest)
      returns (BeginOwnerPublicationResponse);
  rpc CompleteOwnerPublication(CompleteOwnerPublicationRequest)
      returns (CompleteOwnerPublicationResponse);
}
