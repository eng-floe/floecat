syntax = "proto3";

package ai.floedb.floecat.query;

option java_multiple_files = true;
option java_package = "ai.floedb.floecat.query.rpc";
option java_outer_classname = "QuerySchemaProto";

import "floecat/common/common.proto";
import "floecat/query/pinning.proto";
import "floecat/types/types.proto";

/**
 * LOGICAL SCHEMA MODEL
 * ---------------------
 * Defines the unified logical schema exposed to query planners.
 *
 * This schema describes:
 *   - logical column names
 *   - logical type names
 *   - stable field IDs (Iceberg / Delta)
 *   - physical column paths when available
 *   - nullability
 *   - partition indicators
 *
 * It intentionally omits storage-level layout or engine-specific details.
 */
message SchemaColumn {
  // Breaking change: the flat canonical type string (e.g. "INT", "ARRAY") was replaced by the
  // typed recursive `type` field below. Persisted columns written before this change are
  // re-reconciled from upstream metadata where an upstream exists; view output columns with no
  // upstream (created directly via gRPC) are upgraded transparently on load by recovering the
  // legacy string from unknown fields (LogicalTypeProtoAdapter.upgradeLegacyColumn).
  reserved 2;
  reserved "logical_type";

  string name = 1; // Logical column name.
  int32 field_id = 3; // Stable format-level field ID.
  bool nullable = 4; // True if column may contain NULLs.
  string physical_path = 5; // Optional nested path in the physical layout.
  bool partition_key = 6; // True if this is a partition column.
  int64 id = 7; // Internal unique column ID.
  int32 ordinal = 8; // Ordinal position in the schema (1-based within the parent struct).
  bool leaf = 9; // True if this is a leaf (stats-capable); false for containers.

  // The only authoritative semantic type for the column: a recursive tree preserving nested
  // structure and element/value/field nullability. Scalar columns carry a scalar node; complex
  // columns carry the full shape (a complex kind without a shape is a legacy non-parameterised
  // container tag).
  ai.floedb.floecat.types.LogicalType type = 10;
}

/**
 * A complete logical schema for a table or view.
 */
message SchemaDescriptor {
  repeated SchemaColumn columns = 1;
}

/**
 * DESCRIBE INPUTS
 * ----------------
 * Resolves planner-facing metadata for a list of query inputs.
 *
 * Behavior:
 *   - Uses query_id to access pinned snapshots.
 *   - Accepts QueryInput[]
 *   - Returns SchemaDescriptor[] in matching order.
 *   - Populates metadata in the internal QueryContext (expansion, obligations, etc.).
 *
 * No lifecycle state is modified.
 */
message DescribeInputsRequest {
  string query_id = 1; // Must reference an active query.
  repeated ai.floedb.floecat.common.QueryInput inputs = 2; // Inputs to resolve (tables or views).
}

/**
 * Response for DescribeInputs.
 *
 * The `schemas` list is positional: it matches the `inputs` order from the request.
 */
message DescribeInputsResponse {
  repeated SchemaDescriptor schemas = 1; // One schema per input, preserving order.

  // Opaque, planner-facing identity of the pin each input resolved to, positional with `schemas`
  // (same length and order). A table input carries its pin's fingerprint/physical identity for
  // cache identity and diagnostics, taken from the pin that actually won under first-touch; a
  // non-table input (e.g. a view) carries a default (empty) entry to keep positions aligned.
  repeated RelationPinIdentity relation_pins = 2;
}

/**
 * Schema resolution service used by query planning components.
 */
service QuerySchemaService {
  /**
   * DescribeInputs resolves logical schemas for each requested query input.
   */
  rpc DescribeInputs(DescribeInputsRequest)
      returns (DescribeInputsResponse);
}
