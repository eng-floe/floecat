syntax = "proto2";
package ai.floedb.floecat.query;

option java_multiple_files = true;
option java_package = "ai.floedb.floecat.query.rpc";

/**
 * Metadata that applies to one engine or environment and a version range.
 *
 * The payload is opaque to Floecat.  The scope and version bounds determine
 * whether the metadata is applicable to the current catalog context.
 */
message ScopedMetadataRule {
  enum Scope {
    ENGINE = 0;
    ENVIRONMENT = 1;
  }

  // Allow PBtxt readable extension blocks 
  extensions 1 to 99;

  // --- Applicability rules (PBtxt only) ---
  optional string kind = 100;
  optional Scope scope = 202 [default = ENGINE];
  optional string min_version = 101;
  optional string max_version = 102;

  // --- Payload for engine-specific data ---
  optional string payload_type = 200;
  optional bytes  payload      = 201;

  // --- Generic metadata ---
  map<string,string> properties = 300;
}
