syntax = "proto3";
package ai.floedb.floecat.query;

option java_multiple_files = true;
option java_package = "ai.floedb.floecat.query.rpc";

import "floecat/query/system_objects_registry.proto";

// ENGINE. Binder and type-system objects: types, functions, operators, casts, collations and
// aggregates. Relations are not here; they are FROM-clause objects served by RelationService.

/**
 * Request to fetch the built-in SQL objects.
 *
 * The engine selector comes from the inbound `x-engine-kind` / `x-engine-version` headers, so the
 * request carries no engine fields.
 */
message GetSqlObjectsRegistryRequest {
  reserved 1, 2;
  reserved "engine_kind", "engine_version";
}

/**
 * Response containing the built-in SQL objects registry.
 */
message GetSqlObjectsRegistryResponse {
  /** Resolved registry for the engine/version named by the inbound headers. */
  SystemObjectsRegistry registry = 1;
}

/**
 * Service that exposes the engine's SQL object registry.
 */
// ENGINE. Binder and type-system objects, not relations.
service SqlCatalogService {
  /** Returns the SQL object registry for the engine/version named by the inbound headers. */
  rpc GetSqlObjectsRegistry(GetSqlObjectsRegistryRequest) returns (GetSqlObjectsRegistryResponse);
}
